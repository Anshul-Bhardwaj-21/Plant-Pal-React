<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <!-- Background glow -->
  <defs>
    <radialGradient id="glow" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#E0F7FA;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#E0F7FA;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <ellipse cx="250" cy="250" rx="180" ry="180" fill="url(#glow)" />
  
  <!-- Magnifying glass -->
  <g transform="translate(120, 150)">
    <!-- Glass circle -->
    <circle cx="0" cy="0" r="60" fill="#B3E5FC" stroke="#455A64" stroke-width="8"/>
    <circle cx="0" cy="0" r="50" fill="none" stroke="#81D4FA" stroke-width="4"/>
    <!-- Handle -->
    <line x1="42" y1="42" x2="80" y2="80" stroke="#455A64" stroke-width="12" stroke-linecap="round"/>
    <!-- Shine effect -->
    <path d="M -20,-30 Q -15,-35 -10,-30 L -15,-20 Z" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Happy plant character -->
  <g transform="translate(300, 200)">
    <!-- Main leaf (center) -->
    <ellipse cx="0" cy="0" rx="70" ry="100" fill="#8BC34A" stroke="#558B2F" stroke-width="4"/>
    <ellipse cx="0" cy="0" rx="50" ry="80" fill="#AED581"/>
    
    <!-- Left leaf -->
    <ellipse cx="-50" cy="40" rx="45" ry="70" fill="#8BC34A" stroke="#558B2F" stroke-width="4" transform="rotate(-30 -50 40)"/>
    <ellipse cx="-50" cy="40" rx="30" ry="55" fill="#AED581" transform="rotate(-30 -50 40)"/>
    
    <!-- Right leaf -->
    <ellipse cx="50" cy="40" rx="45" ry="70" fill="#8BC34A" stroke="#558B2F" stroke-width="4" transform="rotate(30 50 40)"/>
    <ellipse cx="50" cy="40" rx="30" ry="55" fill="#AED581" transform="rotate(30 50 40)"/>
    
    <!-- Stem -->
    <rect x="-8" y="80" width="16" height="80" fill="#558B2F" rx="8"/>
    
    <!-- Happy face -->
    <circle cx="-20" cy="-10" r="8" fill="#455A64"/>
    <circle cx="20" cy="-10" r="8" fill="#455A64"/>
    <path d="M -25,15 Q 0,30 25,15" fill="none" stroke="#455A64" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Blush -->
    <ellipse cx="-35" cy="5" rx="12" ry="8" fill="#FF8A80" opacity="0.5"/>
    <ellipse cx="35" cy="5" rx="12" ry="8" fill="#FF8A80" opacity="0.5"/>
  </g>
  
  <!-- Phone -->
  <g transform="translate(520, 200)">
    <!-- Phone body -->
    <rect x="0" y="0" width="180" height="320" rx="30" fill="#455A64" stroke="#263238" stroke-width="6"/>
    <rect x="10" y="30" width="160" height="260" rx="15" fill="#B3E5FC"/>
    
    <!-- Notch -->
    <rect x="60" y="5" width="60" height="20" rx="10" fill="#263238"/>
    
    <!-- Chat bubble with leaf icon -->
    <g transform="translate(90, 120)">
      <rect x="-50" y="-35" width="100" height="70" rx="15" fill="#FFD54F" stroke="#455A64" stroke-width="3"/>
      <path d="M -50,25 L -40,35 L -35,25 Z" fill="#FFD54F" stroke="#455A64" stroke-width="3"/>
      
      <!-- Leaf icon in bubble -->
      <g transform="translate(0, -5)">
        <ellipse cx="0" cy="0" rx="20" ry="28" fill="#558B2F" stroke="#33691E" stroke-width="2"/>
        <path d="M 0,-25 Q 0,0 0,25" stroke="#33691E" stroke-width="2" fill="none"/>
        <path d="M 0,0 Q 10,-10 15,-5" stroke="#33691E" stroke-width="1.5" fill="none"/>
        <path d="M 0,0 Q -10,-10 -15,-5" stroke="#33691E" stroke-width="1.5" fill="none"/>
      </g>
    </g>
    
    <!-- Settings gear -->
    <g transform="translate(140, 220)">
      <circle cx="0" cy="0" r="20" fill="#558B2F" stroke="#33691E" stroke-width="3"/>
      <circle cx="0" cy="0" r="8" fill="#B3E5FC"/>
      <!-- Gear teeth -->
      <circle cx="0" cy="-22" r="4" fill="#558B2F"/>
      <circle cx="19" cy="-11" r="4" fill="#558B2F"/>
      <circle cx="19" cy="11" r="4" fill="#558B2F"/>
      <circle cx="0" cy="22" r="4" fill="#558B2F"/>
      <circle cx="-19" cy="11" r="4" fill="#558B2F"/>
      <circle cx="-19" cy="-11" r="4" fill="#558B2F"/>
    </g>
    
    <!-- Home button -->
    <rect x="70" y="300" width="40" height="8" rx="4" fill="#263238"/>
  </g>
</svg>
